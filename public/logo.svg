<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Perfect Vision Billing Software">
  <title>Perfect Vision Billing Software</title>

  <!--
    Built from the written brief (the reference image never arrived).

    Six elements were requested. All six at icon size would read as mud, so
    they are ranked: the eye carries the identity and stays legible at 24px;
    the invoice and rupee sit at supporting size; the cloud and checkmark are
    quiet accents that only resolve at large sizes. Replace this file with the
    real artwork whenever it is available — nothing else needs changing.
  -->

  <defs>
    <clipPath id="pv-card">
      <rect width="512" height="512" rx="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#pv-card)">
    <!-- App-icon ground in dark coffee: legible on cream and on the dark sidebar alike. -->
    <rect width="512" height="512" fill="#4A2E1E" />

    <!-- Cloud (software) — a low-contrast accent behind everything else. -->
    <g fill="#6F4E37" opacity="0.55">
      <circle cx="176" cy="118" r="34" />
      <circle cx="222" cy="102" r="44" />
      <circle cx="272" cy="118" r="32" />
      <rect x="176" y="112" width="96" height="40" rx="20" />
    </g>

    <!-- Eyeglasses (optical) — two rims joined by a bridge, arms to the edges. -->
    <g stroke="#8B6F47" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85">
      <circle cx="150" cy="292" r="58" />
      <circle cx="362" cy="292" r="58" />
      <path d="M208 292c14-16 82-16 96 0" />
      <path d="M92 292c-10-26-6-48 6-64" />
      <path d="M420 292c10-26 6-48-6-64" />
    </g>

    <!-- Eye (vision) — the dominant mark, drawn last so it stays on top. -->
    <g stroke="#F7F1E8" stroke-width="26" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M104 256s60-92 152-92 152 92 152 92-60 92-152 92-152-92-152-92Z" />
      <circle cx="256" cy="256" r="56" />
    </g>
    <circle cx="256" cy="256" r="24" fill="#C8A27A" />

    <!-- Invoice with rupee (billing + payments), overlapping bottom-right. -->
    <g transform="translate(292 306)">
      <rect width="150" height="168" rx="16" fill="#F7F1E8" />
      <!-- torn receipt edge -->
      <path d="M0 168h150l-15 14-15-10-15 10-15-10-15 10-15-10-15 10-15-10-15 10z" fill="#F7F1E8" />

      <!-- Rupee: two bars, descending stem, diagonal leg. -->
      <g stroke="#3B2418" stroke-width="13" stroke-linecap="round" fill="none">
        <path d="M34 40h82" />
        <path d="M34 68h82" />
        <path d="M58 40v88" />
        <path d="M60 68c34 0 40 34 4 34" />
        <path d="M66 102l50 46" />
      </g>
    </g>

    <!-- Checkmark badge (automation / billed successfully). -->
    <g transform="translate(64 344)">
      <circle cx="52" cy="52" r="52" fill="#C8A27A" />
      <path d="M30 54l16 16 30-34" stroke="#3B2418" stroke-width="14"
            fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
