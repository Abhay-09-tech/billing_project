<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Perfect Vision">
  <title>Perfect Vision</title>

  <!--
    Simplified companion to logo.svg for tiny sizes — browser tab, phone home
    screen. The invoice, cloud and checkmark are dropped deliberately: at 16px
    they turn to noise. Eye plus rupee pupil keeps optical and billing legible.
  -->

  <rect width="512" height="512" rx="112" fill="#3B2418" />

  <g stroke="#F7F1E8" stroke-width="34" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M84 256s66-104 172-104 172 104 172 104-66 104-172 104S84 256 84 256Z" />
    <circle cx="256" cy="256" r="64" />
  </g>

  <!-- Rupee inside the pupil: two bars, stem, leg. -->
  <g stroke="#C8A27A" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M228 226h56" />
    <path d="M228 248h56" />
    <path d="M244 226v62" />
    <path d="M246 248c22 0 26 22 2 22" />
    <path d="M250 270l32 30" />
  </g>
</svg>
